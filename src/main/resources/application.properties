# ========================================
# WarrantyWise - Application Configuration
# ========================================

spring.application.name=WarrantyWise
server.port=8080

# Active Profile
spring.profiles.active=dev

# ========================================
# MySQL Database Configuration (Cloud & Local)
# ========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warrantywise_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Hari2025@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# ========================================
# JWT Configuration
# ========================================
app.jwt.secret=WarrantyWiseSecretKeyForJwtTokenGenerationThatIsAtLeast512BitsLongForHS512AlgorithmSecurity2026
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ========================================
# Logging
# ========================================
logging.level.com.warrantywise=DEBUG
logging.level.org.springframework.security=INFO
