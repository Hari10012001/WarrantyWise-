<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Category Management — WarrantyWise">
    <title>Categories — WarrantyWise</title>

    <!-- Bootstrap 5 & Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- WarrantyWise Design System Styles -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="sidebar-backdrop" class="modal-backdrop fade show d-none" style="z-index: 1005;"></div>

    <div id="app-wrapper">
        <!-- SIDEBAR NAVIGATION -->
        <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
            <div class="sidebar-header">
                <a href="/pages/dashboard.html" class="sidebar-brand">
                    <div class="sidebar-brand-icon">W</div>
                    <span>WarrantyWise</span>
                </a>
            </div>

            <div class="sidebar-menu">
                <div class="sidebar-section-label">Main Navigation</div>
                <a href="/pages/dashboard.html" class="sidebar-nav-item">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/pages/products.html" class="sidebar-nav-item">
                    <i class="bi bi-box-seam-fill"></i>
                    <span>Products</span>
                </a>
                <a href="/pages/warranties.html" class="sidebar-nav-item">
                    <i class="bi bi-shield-check"></i>
                    <span>Warranties</span>
                </a>
                <a href="/pages/service-history.html" class="sidebar-nav-item">
                    <i class="bi bi-tools"></i>
                    <span>Service History</span>
                </a>

                <div class="sidebar-section-label">Insights & Tools</div>
                <a href="/pages/reports.html" class="sidebar-nav-item">
                    <i class="bi bi-bar-chart-line-fill"></i>
                    <span>Reports</span>
                </a>
                <a href="/pages/search.html" class="sidebar-nav-item">
                    <i class="bi bi-search"></i>
                    <span>Search</span>
                </a>
                <a href="/pages/notifications.html" class="sidebar-nav-item">
                    <i class="bi bi-bell-fill"></i>
                    <span>Notifications</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile-summary">
                    <div class="user-avatar" id="user-avatar-text">U</div>
                    <div class="overflow-hidden">
                        <div class="fw-semibold text-truncate text-white fs-6" id="user-display-name">User Account</div>
                        <div class="small text-muted-custom" id="user-display-role">Standard User</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <div id="main-content">
            <!-- TOP HEADER BAR -->
            <header class="app-header">
                <div class="d-flex align-items-center gap-3">
                    <button type="button" class="btn-icon" id="sidebar-toggle-btn" aria-label="Toggle Sidebar Navigation">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <div class="header-search d-none d-md-block">
                        <i class="bi bi-search header-search-icon"></i>
                        <input type="text" class="form-control" placeholder="Search..." id="global-search-input">
                    </div>
                </div>

                <div class="header-actions">
                    <button type="button" class="btn-icon" id="theme-toggle-btn" title="Toggle Theme"><i class="bi bi-moon-fill fs-5"></i></button>
                    <a href="/pages/notifications.html" class="btn-icon text-decoration-none"><i class="bi bi-bell fs-5"></i><span class="notification-badge d-none" id="notification-badge-count">0</span></a>
                    <div class="dropdown">
                        <button class="btn btn-icon dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-person-circle fs-5"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end bg-card-custom shadow-lg">
                            <li><a class="dropdown-item" href="/pages/profile.html"><i class="bi bi-person me-2"></i> Profile & Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- BREADCRUMB BAR -->
            <div class="breadcrumb-bar">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-custom">
                        <li class="breadcrumb-item"><a href="/pages/dashboard.html">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Categories</li>
                    </ol>
                </nav>
            </div>

            <!-- PAGE CONTENT BODY -->
            <main class="page-container" id="page-container">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-folder-fill text-primary me-2"></i> Product Categories</h2>
                        <p class="text-muted-custom small mb-0">Browse and manage product taxonomy categories</p>
                    </div>
                </div>

                <div id="categories-list" class="row g-4">
                    <!-- Dynamic Categories -->
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-util.js"></script>
    <script src="/js/theme-util.js"></script>
    <script src="/js/ui-components.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/app-shell.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const listEl = document.getElementById('categories-list');
            try {
                const categories = await ApiClient.get('/categories/active').catch(() => []);
                if (!categories || categories.length === 0) {
                    listEl.innerHTML = `<div class="col-12">${UIComponents.renderEmptyState('No Active Categories', 'Categories will appear here when configured by administrator.', 'bi-folder')}</div>`;
                    return;
                }
                let html = '';
                categories.forEach(c => {
                    html += `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card-custom p-4 h-100 card-custom-hover">
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div class="bg-primary-subtle text-primary rounded-3 p-2 d-flex align-items-center justify-content-center" style="width:44px; height:44px;">
                                        <i class="bi ${c.icon || 'bi-folder'} fs-4"></i>
                                    </div>
                                    <h5 class="fw-bold mb-0 text-main">${c.name}</h5>
                                </div>
                                <p class="small text-muted-custom mb-0">${c.description || 'Standard product category'}</p>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;
            } catch (e) {
                listEl.innerHTML = `<div class="col-12">${UIComponents.renderErrorState('Failed to load categories')}</div>`;
            }
        });
    </script>
</body>
</html>
