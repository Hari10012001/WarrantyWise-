<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to WarrantyWise - Product Warranty, Service History and Renewal Reminder Platform">
    <title>Sign In — WarrantyWise</title>

    <!-- Bootstrap 5 & Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- WarrantyWise Design System Styles -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body class="bg-app min-vh-100 d-flex flex-column justify-content-between">
    <!-- Top Theme Toggle Header -->
    <div class="container-fluid p-3 d-flex justify-content-end">
        <button type="button" class="btn-icon" id="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Dark/Light Theme">
            <i class="bi bi-moon-fill fs-5"></i>
        </button>
    </div>

    <!-- Centered Auth Card -->
    <main class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card-custom p-4 p-sm-5 shadow-lg border">
                    <!-- Brand Logo & Header -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3" style="width: 48px; height: 48px;">
                            <i class="bi bi-shield-check fs-2"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted-custom small">Sign in to your WarrantyWise account</p>
                    </div>

                    <!-- Global Alert Container -->
                    <div id="auth-alert-container" class="d-none mb-3"></div>

                    <!-- Login Form -->
                    <form id="login-form" novalidate>
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-secondary border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                            </div>
                            <div class="invalid-feedback" id="email-error">Please enter a valid email address.</div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-secondary border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                                <button type="button" class="btn btn-outline-secondary border-start-0" id="toggle-password-btn" aria-label="Toggle Password Visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback" id="password-error">Please enter your password.</div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold" id="login-submit-btn">
                                <span id="login-btn-text">Sign In</span>
                                <span id="login-btn-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </div>
                    </form>

                    <!-- Footer Link -->
                    <div class="text-center mt-4 pt-2 border-top">
                        <p class="small text-muted mb-0">Don't have an account? <a href="/pages/register.html" class="fw-semibold">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="text-center py-3 text-muted small">
        &copy; 2026 WarrantyWise. All rights reserved.
    </footer>

    <!-- Toast Engine Container -->
    <div id="toast-container"></div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-util.js"></script>
    <script src="/js/theme-util.js"></script>
    <script src="/js/ui-components.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/auth-pages.js"></script>
</body>
</html>
