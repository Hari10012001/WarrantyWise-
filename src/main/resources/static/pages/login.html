<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to WarrantyWise - Product Warranty, Service History and Renewal Reminder Platform">
    <title>Sign In — WarrantyWise</title>

    <!-- Bootstrap 5 & Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- WarrantyWise Design System Styles -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="bg-auth min-vh-100 d-flex flex-column justify-content-between">
    <!-- Animated Background Shapes -->
    <div class="shape-blob one"></div>
    <div class="shape-blob two"></div>
    <div class="shape-blob three"></div>

    <!-- Top Header -->
    <div class="container-fluid p-3 d-flex justify-content-end position-relative z-3">
        <!-- Kept for backward compatibility, although theme toggle might be disabled in auth -->
        <button type="button" class="btn-icon text-white" id="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Dark/Light Theme">
            <i class="bi bi-moon-fill fs-5"></i>
        </button>
    </div>

    <!-- Centered Auth Card -->
    <main class="container my-auto position-relative z-2">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="glass-card p-4 p-sm-5">
                    <!-- Brand Logo & Header -->
                    <div class="text-center mb-5">
                        <div class="auth-header-icon mb-3">
                            <i class="bi bi-shield-check"></i>
                        </div>
                        <h3 class="fw-bold mb-1 text-white">Welcome back!</h3>
                        <p class="text-white-50 small">Sign in to your WarrantyWise account</p>
                    </div>

                    <!-- Global Alert Container -->
                    <div id="auth-alert-container" class="d-none mb-3"></div>

                    <!-- Login Form -->
                    <form id="login-form" novalidate>
                        <!-- Email Input (Floating) -->
                        <div class="form-floating mb-4">
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                            <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                            <div class="invalid-feedback" id="email-error">Please enter a valid email address.</div>
                        </div>

                        <!-- Password Input (Floating) -->
                        <div class="form-floating mb-4 position-relative">
                            <input type="password" class="form-control pe-5" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                            <button type="button" class="password-toggle" id="toggle-password-btn" aria-label="Toggle Password Visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                            <div class="invalid-feedback" id="password-error">Please enter your password.</div>
                        </div>

                        <div class="d-flex justify-content-end mb-4">
                            <a href="#" class="small auth-link">Forgot Password?</a>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-2 mb-4">
                            <button type="submit" class="btn-auth w-100" id="login-submit-btn">
                                <span id="login-btn-text">SIGN IN</span>
                                <span id="login-btn-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </div>
                        
                        <!-- Social Sign in -->
                        <div class="text-center mb-4">
                            <p class="text-white-50 small mb-3">Or sign in with:</p>
                            <div class="d-flex gap-3 justify-content-center">
                                <button type="button" class="btn btn-social px-4 py-2 flex-grow-1"><i class="bi bi-google me-2 text-danger"></i>Google</button>
                                <button type="button" class="btn btn-social px-4 py-2 flex-grow-1"><i class="bi bi-apple me-2 text-white"></i>Apple</button>
                            </div>
                        </div>
                    </form>

                    <!-- Footer Link -->
                    <div class="text-center pt-2">
                        <p class="small text-white-50 mb-0">Don't have an account? <a href="/pages/register.html" class="auth-link">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="text-center py-3 text-white-50 small position-relative z-2">
        &copy; 2026 WarrantyWise. All rights reserved.
    </footer>

    <!-- Toast Engine Container -->
    <div id="toast-container"></div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-util.js"></script>
    <script src="/js/theme-util.js"></script>
    <script src="/js/ui-components.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/auth-pages.js"></script>
</body>
</html>
